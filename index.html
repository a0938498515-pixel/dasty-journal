['p-avg',3,3,'Ср. прибыль за день',X=>{const d=ent(sumBy(X.xs,t=>t.c.slice(0,10),t=>t.nt));return T(money(d.length?X.s/d.length:0).replace(/\.(\d\d)$/,'.$1'),d[0]?`Ваш лучший день — ${dl(d[0][0])}, результат ${sc(d[0][1])}.`:'',cl(X.s))}],
['p-trend',3,3,'Прибыль',X=>{const v=X.ds.v.slice(-30),n=v.length,mx=(n-1)/2,my=v.reduce((a,b)=>a+b,0)/(n||1),sl=v.reduce((s,y,i)=>s+(i-mx)*(y-my),0),up=sl>=0,ch=X.prev!=null&&X.prev!==Infinity?Math.abs(X.prev):0;return T(money(X.s),`Ваша прибыль <span class="${up?'g':'r'}">${up?'выросла':'снизилась'}</span> примерно на ${ch.toFixed(0)}% за этот период и сейчас <span class="${up?'g':'r'}">${up?'растёт':'снижается'}</span>.`,cl(X.s),trendMini(up))}],
['p-daily',3,2,'Прибыль',X=>{const e=ent(sumBy(X.x,t=>t.c.slice(0,10),t=>t.nt)).sort((a,b)=>a[0]>b[0]?1:-1);return V2(money(X.s),cl(X.s))+cbox('bar',{l:e.map(x=>dl(x[0])),v:e.map(x=>x[1])},{h:240,style:'sign',money:1,tx:e.map(x=>+D(x[0]+' 00:00'))})}],
['p-roi',3,2,'ROI за всё время',X=>{const v=X.ds.v.map(q=>+((q-X.b0)/X.b0*100).toFixed(2));return V2(pct2(v[v.length-1]||0),cl(X.s))+cbox('line',{x:X.ds.t,s:[{v,split:1}]},{dates:1,suf:'%',zero:1,h:240})}],
['p-cum',3,2,'Накопленная прибыль',X=>V2(money(X.s),cl(X.s),`<span class="${cl(X.s)}">${X.s<0?'▾':'▴'} ${(X.s/X.b0*100).toFixed(1)}%</span>`)+cbox('line',{x:X.ds.t,s:[{v:X.ds.v.map(v=>+(v-X.b0).toFixed(2)),split:1}]},{dates:1,money:1,zero:1,h:240})],
['p-key',3,2,'Накопленная прибыль по счетам',X=>{const g=grp(X.x,acN);return V2(plr(g.length,['счёт','счёта','счетов']))+pnlPie(g)}],
['p-hour',3,2,'Прибыль по торговым часам',X=>{const o=sumBy(X.x,t=>D(t.o).getHours(),t=>t.nt),e=Array.from({length:24},(_,h)=>[String(h).padStart(2,0)+':00',o[h]||0]),b=e.slice().sort((a,c)=>c[1]-a[1])[0];return V2(b&&b[1]>0?b[0]:'—')+vb(e,{style:'sign',money:1,thin:1,lw:64})+NOTE('Позиции без корректных дат открытия и закрытия не учитываются в распределении по часу открытия.')}],
['p-wd',3,2,'Сезонность прибыли по дням недели',X=>{const g=WDF.map((n,i)=>[n,X.x.filter(t=>wdi(t)==i),BLS[i%BLS.length]]).filter(q=>q[1].length);return V2(money(X.s),cl(X.s))+pnlPie(g)}],
['p-days',3,1,'Самые прибыльные дни',X=>{const e=ent(sumBy(X.x,t=>t.c.slice(0,10),t=>t.nt)).filter(x=>x[1]>0).slice(0,3);return e.length?V2(dl(e[0][0]))+`<div class="wcap0">Ваш лучший торговый день за этот период — ${link(dl(e[0][0]))}, результат ${sc(e[0][1])}</div>`+LST(e.map(d=>LR(ICAL,`<span class="lnk">${dl(d[0])}</span>`,cntT(X.x.filter(t=>t.c.slice(0,10)==d[0]).length),sc(d[1]),d[1]/X.b0*100,`dayv('${d[0]}')`))):EMPTY}],
['p-top',3,1,'Самые прибыльные сделки',X=>{const a=X.x.filter(t=>t.nt>0).sort((p,q)=>q.nt-p.nt).slice(0,4),t=a[0];return t?V2(esc(sym(t.p)))+`<div class="wcap0">Ваша самая прибыльная сделка за этот период — ${link(dl(t.c.slice(0,10)))}, результат ${sc(t.nt)}</div>`+LST(a.map(q=>trL(q))):EMPTY}],
['p-worst',3,1,'Самые убыточные сделки',X=>{const a=X.x.filter(t=>t.nt<0).sort((p,q)=>p.nt-q.nt).slice(0,4),t=a[0];return t?V2(esc(sym(t.p)))+`<div class="wcap0">Ваша наименее прибыльная сделка за этот период — ${link(dl(t.c.slice(0,10)))}, результат ${sc(t.nt)}</div>`+LST(a.map(q=>trL(q))):EMPTY}],
['p-ses',3,1,'Лучшая торговая сессия',X=>{const g=grp(X.xs,t=>t.s).map(([k,a])=>[k,a,sumf(a,t=>t.nt),stats(a).wr]).sort((a,b)=>b[2]-a[2]),b=g[0];return b?V2(esc(b[0]))+`<div class="wcap0">Ваша лучшая торговая сессия за этот период — ${link(b[0])}, доля прибыльных сделок <span class="${b[3]>=50?'g':'r'}">${pct1(b[3])}</span>.</div>`+LST(g.slice(0,3).map(q=>LR(ICLK,`<span class="lnk">${esc(q[0])}</span>`,cntT(q[1].length),sc(q[2]),q[2]/X.b0*100))):EMPTY}],
['p-instr',3,2,'Прибыль по инструментам',X=>{const e=ent(sumBy(X.x,t=>sym(t.p),t=>t.nt));return V2(e[0]?esc(e[0][0]):'—')+vb(e,{style:'gray',money:1,avg:avgO(e,'Ср. прибыль по инструментам')})}],
['p-strat',3,2,'Прибыль по стратегиям',X=>{const e=ent(sumBy(X.x,stK,t=>t.nt));return V2(e[0]?esc(e[0][0]):'—')+vb(e,{style:'gray',money:1,avg:avgO(e,'Ср. прибыль по стратегиям')})}],
// ---- 4 Доля прибыльных и стабильность
['w-wr',4,1,'Доля прибыльных',X=>T(pct2(X.st.wr),`Сделок за этот период: ${X.st.c}, из них <span class="g">прибыльных: ${X.st.w}</span>.`,'',circles(X.nL,X.nB,X.nW))],
['w-be',4,1,'Безубыточные сделки',X=>ST(`Сделок закрыто в безубыток: ${X.nB} из ${X.x.length}. Это <span class="mu2">${pct1(X.x.length?X.nB/X.x.length*100:0)}</span> всех ваших сделок.`)],
['w-ws',4,1,'Самая длинная серия прибыльных сделок',X=>{const r=streak(X.xs,'Win');return T(cntT(r.n),`Прибыль по этим сделкам: ${sc(r.p)}`,'',pills(Math.min(14,r.n)).replace('class="pls"','class="pls gpl"'))}],
['w-ls',4,1,'Самая длинная серия убытков',X=>{const r=streak(X.xs,'Loss');return T(cntT(r.n),`Убыток по этим сделкам: ${sc(r.p)}`,'',pills(Math.min(14,r.n)))}],
['w-trend',4,4,'Динамика доли прибыльных',X=>{const q=X.xs,t=[],v=[];q.forEach((tr,j)=>{t.push(+D(tr.c));v.push(+stats(q.slice(0,j+1)).wr.toFixed(1))});return V2(pct2(X.st.wr))+cbox('line',{x:t,s:[{v,col:BL,area:1}]},{dates:1,suf:'%',h:230})}],
['w-wl',4,2,'Прибыльные и убыточные за всё время',X=>{const all=S.trades.filter(t=>(S.acct=='all'||t.a==S.acct)&&incT(t)),w=all.filter(t=>t.res=='Win'),l=all.filter(t=>t.res=='Loss');return V2(pct2(all.length?w.length/all.length*100:0))+pie([{l:'Прибыльные',v:w.length,s:String(w.length),c:'#2fbf71'},{l:'Убыточные',v:l.length,s:String(l.length),c:'#e8594a'}],{center:all.length,centerSub:'сделок'})}],
['w-instr',4,2,'Доля прибыльных по инструментам',X=>{const e=grp(X.xs,t=>sym(t.p)).map(([k,a])=>[k,stats(a).wr]).sort((a,b)=>b[1]-a[1]);return vb(e,{style:'gray',suf:'%',fmt:pct1,avg:{l:'Ср. доля прибыльных',v:X.st.wr}})}],
['w-hour',4,2,'Доля прибыльных по часам',X=>{const o={};X.xs.forEach(t=>{const h=D(t.o).getHours();(o[h]=o[h]||[]).push(t)});const e=Array.from({length:24},(_,h)=>[String(h).padStart(2,0)+':00',o[h]?stats(o[h]).wr:0]);return vb(e,{style:'blue',suf:'%',fmt:pct1,thin:1,lw:64})}],
['w-strat',4,2,'Доля прибыльных по стратегиям',X=>{const g=grp(X.xs,stK);return V2(pct2(X.st.wr))+pie(g.map(([k,a],i)=>({l:k,v:a.length,s:pct2(stats(a).wr),n:a.length})),{center:pct2(X.st.wr),centerSub:'Сделок: '+X.xs.length})}],
['w-key',4,2,'Доля прибыльных по счетам',X=>vb(grp(X.xs,acN).map(([k,a])=>[k,stats(a).wr]),{style:'blue',suf:'%',fmt:pct1})],
// ---- 5 Риск и просадка
['r-arr',5,1,'Ср. риск/прибыль',X=>{const a=X.xs.filter(t=>t.rk),v=a.length?sumf(a,t=>t.r)/a.length:0;return T(v.toFixed(1),`Ср. риск на сделку — ${usd(a.length?sumf(a,t=>t.rk)/a.length:0)}, доля прибыльных — <span class="g">${pct0(X.st.wr)}</span>.`,'',miniBars(a.map(t=>t.r),v,v.toFixed(1)))}],
['r-max',5,1,'Макс. просадка',X=>T(X.m.dd[0],`Самая долгая просадка длилась ${plr(Math.round(X.I.lg),['день','дня','дней'])}.`)],
['r-cur',5,1,'Текущая просадка',X=>T(X.I.cur<0?money(X.I.cur):'$0.00',X.I.cur<0?`Вы в <span class="r">просадке</span> уже ${plr(Math.round(X.I.cd),['день','дня','дней'])}.`:'Ваш баланс на пике.')],
['r-pf',5,1,'Профит-фактор',X=>ST(X.st.pf>=1?`Сейчас ваш профит-фактор — <span class="g">${fpf(X.st.pf)}</span>, это отличный результат! Значение больше 1 означает, что вы зарабатываете.`:`Сейчас ваш профит-фактор — ${fpf(X.st.pf)}, <span class="r">ниже безубытка.</span> Значение больше 1 означает, что вы зарабатываете.`)],
['r-brr',5,1,'Лучший риск/прибыль',X=>{const t=X.xs.filter(q=>q.rk).sort((a,b)=>b.r-a.r)[0];return t?T(t.r.toFixed(1),`Сделка с лучшим риском/прибылью — по ${esc(sym(t.p))}, результат ${sc(t.nt)}.`,'',badge(sym(t.p))):emptyW('Нет данных о риске/прибыли за выбранный период.')}],
['r-rew',5,1,'Ср. прибыль на сделку',X=>{const a=X.xs.filter(t=>t.rk);return a.length?ST(`Ваш средний риск на сделку — ${usd(sumf(a,t=>t.rk)/a.length)}, доля прибыльных — <span class="g">${pct0(X.st.wr)}</span>.`):emptyW('Укажите риск в сделках, чтобы увидеть среднюю прибыль.')}],
['r-wrr',5,1,'Худший риск/прибыль',X=>{const t=X.xs.filter(q=>q.rk).sort((a,b)=>a.r-b.r)[0];return t?T(t.r.toFixed(1),`Сделка с худшим риском/прибылью — по ${esc(sym(t.p))}, результат ${sc(t.nt)}.`,'',badge(sym(t.p))):emptyW('Нет данных о риске/прибыли за выбранный период.')}],
['r-long',5,1,'Самая долгая просадка',X=>{const per=Math.max(1,(X.ds.t[X.ds.t.length-1]-X.ds.t[0])/864e5);return T(plr(Math.round(X.I.lg),['день','дня','дней']),`За это время баланс снизился на <span class="r">${money(X.I.dd)}</span>`,'',pills(Math.max(X.I.lg>0?1:0,Math.round(X.I.lg/per*14))))}],
['r-ddt',5,2,'Макс. просадка во времени',X=>{const wk=[];let pk=-Infinity,cur=null,k=0;X.ds.t.forEach((t,i)=>{const v=X.ds.v[i];pk=Math.max(pk,v);const w=Math.floor((t-X.ds.t[0])/6048e5);if(w!==cur){cur=w;wk.push(['Неделя '+(w+1),0])}wk[wk.length-1][1]=Math.max(wk[wk.length-1][1],pk-v)});return V2(X.m.dd[0])+vb(wk.slice(-12),{money:1,neg:1,style:'blue'})}],
['r-rec',5,2,'Время восстановления',X=>X.I.dd<0&&X.I.rec!=null?V2(plr(Math.round(X.I.rec),['день','дня','дней']))+`<div class="wcap0">Столько дней понадобилось, чтобы вернуть баланс на пик после максимальной просадки.</div>`:emptyW('За выбранный период нет восстановленных просадок. Для расчёта времени восстановления нужна завершённая просадка.')],
['r-loss',5,2,'Ср. убыток по инструментам',X=>{const g=grp(X.xs.filter(t=>t.nt<0),t=>sym(t.p)).map(([k,a])=>[k,-sumf(a,t=>t.nt)/a.length]).sort((a,b)=>b[1]-a[1]),L=X.xs.filter(t=>t.nt<0);return vb(g,{style:'gray',money:1,neg:1,avg:L.length?{l:'Ср. убыток на сделку',v:-sumf(L,t=>t.nt)/L.length}:null,empty:'Нет убыточных сделок за выбранный период.'})+NOTE('В некоторых категориях нет убыточных позиций или не хватает данных о прибыли. Для них средний убыток не показан.')}],
['r-hold',5,2,'Прибыль по времени в позиции',X=>{const e=ordE(sumBy(X.xs,t=>h5(dur(t)),t=>t.nt),H5.map(b=>b[0]));return vb(e,{style:'gray',money:1,avg:X.xs.length?{l:'Ср. прибыль по времени в позиции',v:sumf(X.xs,t=>t.nt)/X.xs.length}:null})+NOTE('Позиции без корректных дат открытия и закрытия не учитываются в распределении времени в позиции.')}],
['r-risk',5,2,'Прибыль по риску',X=>{const e=ordE(sumBy(X.xs,RRB,t=>t.nt),RRK).filter(q=>q[1]||q[0]=='Без планового R:R');return vb(e,{style:'gray',money:1,avg:X.xs.length?{l:'Ср. прибыль по риску',v:sumf(X.xs,t=>t.nt)/X.xs.length}:null})+NOTE('Плановый R:R — расстояние до тейк-профита, делённое на расстояние до стоп-лосса. Позиции без тейка или стопа показаны в группе «Без планового R:R».')}],
['r-rules',5,2,'Правила риск-менеджмента',X=>riskCard(X.xs).replace(/^<div class="cd">(<h4>[^<]*<\/h4>)?/,'<div>')],
// ---- 6 Анализ стратегий
['s-most',6,2,'Самая торгуемая стратегия',X=>{const e=ent(sumBy(X.xs,stK,()=>1));return V2(e[0]?esc(e[0][0]):'—','',e[0]?cntS(e[0][1]):'')+vb(e,{style:'blue',fmt:cntT,h:200})}],
['s-best',6,2,'Лучшая стратегия',X=>{const e=ent(sumBy(X.x,stK,t=>t.nt));return e[0]?V2(esc(e[0][0]))+`<div class="wcap0">Ваша лучшая стратегия за этот период — ${esc(e[0][0])}, общий результат ${sc(e[0][1])}</div>`+vb(e.slice(0,6),{style:'sign',money:1,h:180}):EMPTY}],
['s-worst',6,2,'Худшая стратегия',X=>{const e=ent(sumBy(X.x,stK,t=>t.nt),0);return e[0]?V2(esc(e[0][0]))+`<div class="wcap0">Ваша худшая стратегия за этот период — ${esc(e[0][0])}, общий результат ${sc(e[0][1])}</div>`+vb(e.slice(0,6),{style:'sign',money:1,h:180}):EMPTY}],
['s-wr',6,2,'Доля прибыльных по стратегиям',X=>{const g=grp(X.xs,stK);return V2(pct2(X.st.wr))+pie(g.map(([k,a])=>({l:k,v:a.length,s:pct2(stats(a).wr),n:a.length})),{center:pct2(X.st.wr),centerSub:'Сделок: '+X.xs.length})}],
['s-avg',6,2,'Ср. прибыль по стратегиям',X=>{const e=grp(X.x,stK).map(([k,a])=>[k,sumf(a,t=>t.nt)/a.length]).sort((a,b)=>b[1]-a[1]);return vb(e,{style:'gray',money:1,avg:X.x.length?{l:'Ср. прибыль по стратегиям',v:sumf(X.x,t=>t.nt)/X.x.length}:null})}],
['s-be',6,2,'Безубыточные сделки по стратегиям',X=>{const b=X.x.filter(t=>t.res=='BE');return b.length?vb(ent(sumBy(b,stK,()=>1)),{style:'blue',fmt:cntT}):emptyW('Нет безубыточных позиций за выбранный период.')}],
['s-entry',6,2,'Прибыль по критериям позиции',X=>{const o={};X.x.forEach(t=>String(t.crit||'').split(',').map(v=>v.trim()).filter(Boolean).forEach(v=>o[v]=(o[v]||0)+t.nt));const e=ent(o);return e.length?vb(e,{style:'gray',money:1,avg:avgO(e,'Ср. прибыль по критериям')}):emptyW('Добавьте «Критерии позиции» к сделкам в журнале (через запятую), чтобы увидеть статистику.')}],
['s-exit',6,2,'Прибыль по причине выхода',X=>{const a=X.x.filter(t=>t.xr);return a.length?vb(ent(sumBy(a,t=>XR[t.xr]||t.xr,t=>t.nt)),{style:'sign',money:1}):emptyW('Причину выхода (стоп, тейк, вручную) присылает советник MT5.')}],
['s-comb',6,2,'Прибыль по комбинациям причин',X=>{const a=X.x.filter(t=>t.crit),e=ent(sumBy(a,t=>String(t.crit).split(',').map(v=>v.trim()).filter(Boolean).sort().join(' + '),t=>t.nt));return e.length?vb(e,{style:'sign',money:1}):emptyW('Добавьте «Критерии позиции» к сделкам, чтобы сравнить комбинации.')}],
['s-combw',6,2,'Доля прибыльных по комбинациям причин',X=>{const g=grp(X.xs.filter(t=>t.crit),t=>String(t.crit).split(',').map(v=>v.trim()).filter(Boolean).sort().join(' + '));return g.length?pie(g.map(([k,a])=>({l:k,v:a.length,s:pct2(stats(a).wr),n:a.length})),{center:pct2(stats(g.flatMap(q=>q[1])).wr),centerSub:'Сделок: '+g.reduce((s,q)=>s+q[1].length,0)}):emptyW('Добавьте «Критерии позиции» к сделкам, чтобы сравнить комбинации.')}],
// ---- 7 Анализ инструментов
['i-best',7,1,'Лучший инструмент',X=>{const g=grp(X.xs,t=>sym(t.p)).map(([k,a])=>[k,a,sumf(a,t=>t.nt)]).sort((a,b)=>b[2]-a[2])[0];return g?T(esc(g[0]),`За этот период сделок открыто: ${g[1].length}, прибыль — ${sc(g[2])}, доля прибыльных — ${pct1(stats(g[1]).wr)}.`,'',badge(g[0])):EMPTY}],
['i-worst',7,1,'Худший инструмент',X=>{const g=grp(X.xs,t=>sym(t.p)).map(([k,a])=>[k,a,sumf(a,t=>t.nt)]).sort((a,b)=>a[2]-b[2])[0];return g?T(esc(g[0]),`За этот период вы ${g[2]<0?'потеряли':'заработали'} ${sc(g[2])} на этом активе, доля прибыльных — ${pct0(stats(g[1]).wr)}.`,'',badge(g[0])):EMPTY}],
['i-most',7,1,'Самый торгуемый',X=>{const g=grp(X.xs,t=>sym(t.p)).sort((a,b)=>b[1].length-a[1].length)[0];return g?T(esc(g[0]),`За этот период сделок открыто: ${g[1].length}, общая доля прибыльных — около ${pct1(stats(g[1]).wr)}.`,'',badge(g[0])):EMPTY}],
